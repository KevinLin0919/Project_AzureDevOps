trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
- name: runbook
  displayName: 選擇 Runbook
  type: string
  values:
    - create_project
    - modify_member

- name: project_name
  displayName: 專案名稱
  type: string
  default: ''

- name: pipeline_name
  displayName: Pipeline 名稱 (create_project 用)
  type: string
  default: 'CI Pipeline'

- name: managers
  displayName: '[create_project] Project Manager emails｜可填多位，空白分隔，如：a@co.com b@co.com｜不需要請填 N/A'
  type: string
  default: 'N/A'

- name: members
  displayName: '[create_project] Project Member emails｜可填多位，空白分隔，如：a@co.com b@co.com｜不需要請填 N/A'
  type: string
  default: 'N/A'

- name: add_manager
  displayName: '[modify_member] 新增 Project Manager emails｜可填多位，空白分隔｜不需要請填 N/A'
  type: string
  default: 'N/A'

- name: remove_manager
  displayName: '[modify_member] 移除 Project Manager emails｜可填多位，空白分隔｜不需要請填 N/A'
  type: string
  default: 'N/A'

- name: add_member
  displayName: '[modify_member] 新增 Project Member emails｜可填多位，空白分隔｜不需要請填 N/A'
  type: string
  default: 'N/A'

- name: remove_member
  displayName: '[modify_member] 移除 Project Member emails｜可填多位，空白分隔｜不需要請填 N/A'
  type: string
  default: 'N/A'

steps:
- script: |
    RUNBOOK="${{ parameters.runbook }}"
    PROJECT_NAME="${{ parameters.project_name }}"
    ERRORS=""

    if [ -z "$PROJECT_NAME" ]; then
      ERRORS="$ERRORS\n  - 專案名稱 為必填"
    fi

    if [ "$RUNBOOK" = "modify_member" ]; then
      ADD_MANAGER="${{ parameters.add_manager }}"
      REMOVE_MANAGER="${{ parameters.remove_manager }}"
      ADD_MEMBER="${{ parameters.add_member }}"
      REMOVE_MEMBER="${{ parameters.remove_member }}"
      if [ "$ADD_MANAGER" = "N/A" ] && [ "$REMOVE_MANAGER" = "N/A" ] && [ "$ADD_MEMBER" = "N/A" ] && [ "$REMOVE_MEMBER" = "N/A" ]; then
        ERRORS="$ERRORS\n  - modify_member 至少需填寫一個欄位（新增/移除 Manager 或 Member）"
      fi
    fi

    if [ -n "$ERRORS" ]; then
      echo "##[error]必填欄位未填寫：$(printf "$ERRORS")"
      exit 1
    fi
    echo "參數驗證通過 ✓"
  displayName: 'Validate parameters'

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
  displayName: 'Use Python 3.11'

- script: |
    pip install -r asgards/requirements.txt
    pip install -e asgards/
  displayName: 'Install asgards package'

- ${{ if eq(parameters.runbook, 'create_project') }}:
  - script: |
      [ "$MANAGERS" != "N/A" ] && MANAGERS_FLAG="--managers $MANAGERS" || MANAGERS_FLAG=""
      [ "$MEMBERS" != "N/A" ]  && MEMBERS_FLAG="--members $MEMBERS"    || MEMBERS_FLAG=""
      python runbooks/create_project.py \
        --project "$PROJECT_NAME" \
        --pipeline-name "$PIPELINE_NAME" \
        $MANAGERS_FLAG \
        $MEMBERS_FLAG
    displayName: 'Run create_project runbook'
    env:
      AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
      AZURE_DEVOPS_ORG_URL: $(AZURE_DEVOPS_ORG_URL)
      PROJECT_NAME: ${{ parameters.project_name }}
      PIPELINE_NAME: ${{ parameters.pipeline_name }}
      MANAGERS: ${{ parameters.managers }}
      MEMBERS: ${{ parameters.members }}

- ${{ if eq(parameters.runbook, 'modify_member') }}:
  - script: |
      [ "$ADD_MANAGER" != "N/A" ]    && ADD_MANAGER_FLAG="--add-manager $ADD_MANAGER"          || ADD_MANAGER_FLAG=""
      [ "$REMOVE_MANAGER" != "N/A" ] && REMOVE_MANAGER_FLAG="--remove-manager $REMOVE_MANAGER" || REMOVE_MANAGER_FLAG=""
      [ "$ADD_MEMBER" != "N/A" ]     && ADD_MEMBER_FLAG="--add-member $ADD_MEMBER"             || ADD_MEMBER_FLAG=""
      [ "$REMOVE_MEMBER" != "N/A" ]  && REMOVE_MEMBER_FLAG="--remove-member $REMOVE_MEMBER"    || REMOVE_MEMBER_FLAG=""
      python runbooks/modify_member.py \
        --project "$PROJECT_NAME" \
        $ADD_MANAGER_FLAG \
        $REMOVE_MANAGER_FLAG \
        $ADD_MEMBER_FLAG \
        $REMOVE_MEMBER_FLAG
    displayName: 'Run modify_member runbook'
    env:
      AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
      AZURE_DEVOPS_ORG_URL: $(AZURE_DEVOPS_ORG_URL)
      PROJECT_NAME: ${{ parameters.project_name }}
      ADD_MANAGER: ${{ parameters.add_manager }}
      REMOVE_MANAGER: ${{ parameters.remove_manager }}
      ADD_MEMBER: ${{ parameters.add_member }}
      REMOVE_MEMBER: ${{ parameters.remove_member }}
